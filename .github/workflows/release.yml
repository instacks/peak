# Publishes @instacks/peak to npm when a version tag (v1.2.3, v2.0.0-beta.1) is pushed.
#
# Authentication: npm trusted publishing (OpenID Connect, no token to store). Configure it once on
# npmjs.com › @instacks/peak › Settings › Trusted publishing: GitHub Actions, this repository,
# workflow file "release.yml". npm only offers that for a package that exists, so the very first
# version is published by hand (`npm publish` from a clean checkout after `npm test`).
# Trusted publishing also attaches a provenance statement to every version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

