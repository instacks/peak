<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peak typography</title>
    <link rel="stylesheet" href="../../dist/peak.css" />
    <!-- typography.test.mjs fills this with input values; unlayered, like the Stacks css template's layer would be after Peak -->
    <style id="inputs"></style>
  </head>
  <body>
    <main class="container">
      <h1 id="h1">Heading 1</h1>
      <h2 id="h2">Heading 2</h2>
      <h3 id="h3">Heading 3</h3>
      <h4 id="h4">Heading 4</h4>
      <h5 id="h5">Heading 5</h5>
      <p id="text">Body text</p>
      <button id="button">Button</button>

      <hgroup id="eyebrow-group">
        <p id="eyebrow">Mock-up</p>
        <h2 id="eyebrow-heading">Our stacks</h2>
      </hgroup>
      <hgroup id="subtitle-group">
        <h2 id="subtitle-heading">Title</h2>
        <p id="subtitle">Subtitle</p>
      </hgroup>
      <p class="peak-eyebrow secondary" id="eyebrow-class">Label</p>
      <h3 id="after-eyebrow">Heading after a .peak-eyebrow</h3>

      <p class="peak-display" id="display">One family, two voices</p>
      <div id="lead-parent"><p class="peak-lead" id="lead">A lead paragraph that is a little larger.</p></div>

      <p><span class="peak-text-primary" id="text-primary">primary</span> <span class="peak-text-muted" id="text-muted">muted</span></p>
      <h3 class="peak-h4" id="h3-as-h4">Heading 3 at h4 size</h3>
      <p class="peak-tabular" id="tabular">1.284</p>

      <section id="section"><p>Section</p></section>
      <pre id="pre"><code>line</code></pre>
      <figure><img alt="" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" /><figcaption id="caption">Caption</figcaption></figure>
    </main>
  </body>
</html>
